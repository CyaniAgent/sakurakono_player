targets:
  $default:
    builders:
      freezed:
        options:
          unions: sealed
          equal: true
          toStringOverride: true
      json_serializable:
        options:
          explicit_to_json: true
      # Hive TypeAdapter 注册在 bilibili bridge 的 initHive() 手动完成
      # （覆盖登录/cookie 等非 @HiveType 适配器），不使用生成的 registrar。
      hive_ce_generator:hive_registrar_generator:
        enabled: false
